<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-labelledby="ttl dsc">
<title id="ttl">Bitcoin silent payments flow</title>
<desc id="dsc">BIP-352 flow. The seller generates scan and spend keys and shares one sp1 address. The payer's silent-payments-capable wallet derives a unique taproot output from the sum of its input private keys and that address and broadcasts an ordinary transaction with no announcement. The receiver scans block tweak data from an oracle or own node using the scan key, derives the spend key and sweeps. A library exists in the repository but is not wired into the web app or relayer.</desc>
<style>
:root{--bg:#ffffff;--fg:#1b1f24;--mut:#4d5866;--box:#eef1f6;--line:#6b778a;--acc:#1f4fc4;--accbg:#dbe6ff;--warn:#8a4b00;--warnbg:#fff0d0;--bad:#a8200f;--badbg:#fde4e1;--ok:#13663a;--okbg:#dcf3e4}
@media (prefers-color-scheme:dark){:root{--bg:#0f1318;--fg:#e6e9ee;--mut:#a3aebd;--box:#1a212b;--line:#7d8a9d;--acc:#8fb2ff;--accbg:#1c2c52;--warn:#ffb454;--warnbg:#3a2a0e;--bad:#ff9b92;--badbg:#411a17;--ok:#74d9a0;--okbg:#12331f}}
svg{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.bg{fill:var(--bg)}
.t{fill:var(--fg);font-size:14px}.b{font-weight:700}.m{fill:var(--mut)}.s{font-size:12px}.h{font-size:20px;font-weight:700}
.box{fill:var(--box);stroke:var(--line);stroke-width:1.5}
.box.acc{fill:var(--accbg);stroke:var(--acc)}.box.warn{fill:var(--warnbg);stroke:var(--warn)}
.box.bad{fill:var(--badbg);stroke:var(--bad)}.box.ok{fill:var(--okbg);stroke:var(--ok)}
.dash{stroke-dasharray:6 4}
.grp{fill:none;stroke:var(--line);stroke-width:1.3;stroke-dasharray:3 5}
.ln{fill:none;stroke:var(--line);stroke-width:2}.ln.acc{stroke:var(--acc)}.ln.warn{stroke:var(--warn)}.ln.bad{stroke:var(--bad)}.ln.ok{stroke:var(--ok)}
.ah{fill:var(--line)}
.bdg{fill:var(--acc)}.bdgt{fill:var(--bg);font-size:12px;font-weight:700}
.ta{text-anchor:middle}
</style>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--line)"/></marker><marker id="ar-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--acc)"/></marker><marker id="ar-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--warn)"/></marker><marker id="ar-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--bad)"/></marker><marker id="ar-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--ok)"/></marker></defs>
<rect class="bg" width="960" height="560"/>
<text class="t h" x="24" y="34">Bitcoin silent payments (BIP-352)</text>
<text class="t m s" x="24" y="54">Library only: tested against the official vectors; not in the web app or relayer; not verified on a real network.</text>
<rect class="box acc" x="20" y="90" width="220" height="100" rx="8"/>
<text class="t ta b" x="130.0" y="119.5">1  Seller keys + address</text>
<text class="t ta m s" x="130.0" y="136.5">scan key + spend key</text>
<text class="t ta m s" x="130.0" y="153.5">one reusable sp1… address</text>
<text class="t ta m s" x="130.0" y="170.5">or bitcoin:?sp= link</text>
<rect class="box warn" x="300" y="90" width="220" height="100" rx="8"/>
<text class="t ta b" x="410.0" y="119.5">2  Payer's wallet</text>
<text class="t ta m s" x="410.0" y="136.5">must support silent payments</text>
<text class="t ta m s" x="410.0" y="153.5">derives a unique output from</text>
<text class="t ta m s" x="410.0" y="170.5">its input keys + your address</text>
<rect class="box ok" x="580" y="90" width="220" height="100" rx="8"/>
<text class="t ta b" x="690.0" y="119.5">3  Bitcoin chain</text>
<text class="t ta m s" x="690.0" y="136.5">ordinary-looking taproot</text>
<text class="t ta m s" x="690.0" y="153.5">output; no announcement,</text>
<text class="t ta m s" x="690.0" y="170.5">no registry, no router</text>
<rect class="box warn" x="580" y="260" width="220" height="100" rx="8"/>
<text class="t ta b" x="690.0" y="289.5">4  Tweak data source</text>
<text class="t ta m s" x="690.0" y="306.5">own node or an oracle</text>
<text class="t ta m s" x="690.0" y="323.5">(BlindBit style); the oracle</text>
<text class="t ta m s" x="690.0" y="340.5">gets block heights only</text>
<rect class="box acc" x="300" y="260" width="220" height="100" rx="8"/>
<text class="t ta b" x="410.0" y="289.5">5  Receiver scans</text>
<text class="t ta m s" x="410.0" y="306.5">scan secret stays local;</text>
<text class="t ta m s" x="410.0" y="323.5">finds outputs per block</text>
<text class="t ta m s" x="410.0" y="340.5">(labels supported)</text>
<rect class="box acc" x="20" y="260" width="220" height="100" rx="8"/>
<text class="t ta b" x="130.0" y="289.5">6  Spend</text>
<text class="t ta m s" x="130.0" y="306.5">derive spend key per output</text>
<text class="t ta m s" x="130.0" y="323.5">signed PSBT / raw tx sweep</text>
<text class="t ta m s" x="130.0" y="340.5">(no hardware-wallet signing)</text>
<path class="ln acc" d="M240 140 L300 140" marker-end="url(#ar-acc)"/>
<path class="ln acc" d="M520 140 L580 140" marker-end="url(#ar-acc)"/>
<path class="ln " d="M690 190 L690 260" marker-end="url(#ar)"/>
<path class="ln " d="M580 310 L520 310" marker-end="url(#ar)"/>
<path class="ln " d="M300 310 L240 310" marker-end="url(#ar)"/>
<text class="t m s" x="244" y="130">address</text>
<text class="t m s" x="530" y="130">tx</text>
<rect class="box warn" x="20" y="395" width="920" height="145" rx="8"/>
<text class="t b" x="36" y="419">Limits to remember</text>
<text class="t s" x="36" y="439">Amounts, timing and the spend are public. Silent payments avoid address reuse; they do not hide the transaction graph.</text>
<text class="t s" x="36" y="457">The payer needs a silent-payments-capable wallet; support is uneven. A web page cannot build the payer's output for an ordinary wallet.</text>
<text class="t s" x="36" y="475">An oracle you do not run can see which block heights you ask about and can lie or withhold; running your own node is better.</text>
<text class="t s" x="36" y="493">No enforceable GhostPay fee on Bitcoin. Hosted scanning is only a possible later product (planned).</text>
<text class="t s" x="36" y="511">Status: planned for the product. The library is built and tested; the app does not use it yet.</text>
</svg>
