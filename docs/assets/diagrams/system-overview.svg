<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" role="img" aria-labelledby="ttl dsc">
<title id="ttl">GhostPay system overview</title>
<desc id="dsc">Components of GhostPay. The static web app runs in your browser and talks to an RPC provider you choose. On the EVM chain sit the router, the ERC-5564 announcer, the sweep relayer contract and the experimental policy account. An optional relayer service sponsors sweeps. A Bitcoin silent payments library exists but is not wired into the app. Nothing is deployed; testnet only.</desc>
<style>
:root{--bg:#ffffff;--fg:#1b1f24;--mut:#4d5866;--box:#eef1f6;--line:#6b778a;--acc:#1f4fc4;--accbg:#dbe6ff;--warn:#8a4b00;--warnbg:#fff0d0;--bad:#a8200f;--badbg:#fde4e1;--ok:#13663a;--okbg:#dcf3e4}
@media (prefers-color-scheme:dark){:root{--bg:#0f1318;--fg:#e6e9ee;--mut:#a3aebd;--box:#1a212b;--line:#7d8a9d;--acc:#8fb2ff;--accbg:#1c2c52;--warn:#ffb454;--warnbg:#3a2a0e;--bad:#ff9b92;--badbg:#411a17;--ok:#74d9a0;--okbg:#12331f}}
svg{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.bg{fill:var(--bg)}
.t{fill:var(--fg);font-size:14px}.b{font-weight:700}.m{fill:var(--mut)}.s{font-size:12px}.h{font-size:20px;font-weight:700}
.box{fill:var(--box);stroke:var(--line);stroke-width:1.5}
.box.acc{fill:var(--accbg);stroke:var(--acc)}.box.warn{fill:var(--warnbg);stroke:var(--warn)}
.box.bad{fill:var(--badbg);stroke:var(--bad)}.box.ok{fill:var(--okbg);stroke:var(--ok)}
.dash{stroke-dasharray:6 4}
.grp{fill:none;stroke:var(--line);stroke-width:1.3;stroke-dasharray:3 5}
.ln{fill:none;stroke:var(--line);stroke-width:2}.ln.acc{stroke:var(--acc)}.ln.warn{stroke:var(--warn)}.ln.bad{stroke:var(--bad)}.ln.ok{stroke:var(--ok)}
.ah{fill:var(--line)}
.bdg{fill:var(--acc)}.bdgt{fill:var(--bg);font-size:12px;font-weight:700}
.ta{text-anchor:middle}
</style>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--line)"/></marker><marker id="ar-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--acc)"/></marker><marker id="ar-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--warn)"/></marker><marker id="ar-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--bad)"/></marker><marker id="ar-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--ok)"/></marker></defs>
<rect class="bg" width="900" height="560"/>
<text class="t h" x="24" y="34">System overview</text>
<text class="t m s" x="24" y="54">Status: pre-audit, nothing deployed, testnets only. Solid = built in this repository; dashed = experimental or not wired in.</text>
<rect class="box" x="24" y="80" width="230" height="56" rx="8"/>
<text class="t ta b" x="139.0" y="96.0">Static web host</text>
<text class="t ta m s" x="139.0" y="113.0">serves app files; sees your IP,</text>
<text class="t ta m s" x="139.0" y="130.0">not the part after #</text>
<rect class="grp" x="24" y="170" width="400" height="250" rx="12"/>
<text class="t m s b" x="36" y="188">Your browser (React + Vite app, no GhostPay server)</text>
<rect class="box acc" x="44" y="196" width="360" height="58" rx="8"/>
<text class="t ta b" x="224.0" y="221.5">Seller keys + invoice creation</text>
<text class="t ta m s" x="224.0" y="238.5">keys in memory; encrypted keystore backup</text>
<rect class="box acc" x="44" y="264" width="360" height="58" rx="8"/>
<text class="t ta b" x="224.0" y="289.5">Pay page</text>
<text class="t ta m s" x="224.0" y="306.5">reviews invoice, builds router call, wallet signs</text>
<rect class="box acc" x="44" y="332" width="360" height="66" rx="8"/>
<text class="t ta b" x="224.0" y="353.0">Scanner worker + sweep</text>
<text class="t ta m s" x="224.0" y="370.0">view-tag filter, local tag vault (encrypted)</text>
<text class="t ta m s" x="224.0" y="387.0">stealth key derived in memory to sign sweeps</text>
<rect class="box warn" x="470" y="196" width="150" height="90" rx="8"/>
<text class="t ta b" x="545.0" y="220.5">RPC provider</text>
<text class="t ta m s" x="545.0" y="237.5">you choose it</text>
<text class="t ta m s" x="545.0" y="254.5">sees IP, queries,</text>
<text class="t ta m s" x="545.0" y="271.5">broadcast txs</text>
<rect class="grp" x="660" y="70" width="220" height="330" rx="12"/>
<text class="t m s b" x="672" y="88">EVM chain (Sepolia, Base Sepolia)</text>
<rect class="box ok" x="676" y="96" width="188" height="52" rx="8"/>
<text class="t ta b" x="770.0" y="118.5">GhostPayRouter</text>
<text class="t ta m s" x="770.0" y="135.5">25 bps fee + announce</text>
<rect class="box ok" x="676" y="160" width="188" height="52" rx="8"/>
<text class="t ta b" x="770.0" y="182.5">ERC-5564 Announcer</text>
<text class="t ta m s" x="770.0" y="199.5">public log of payments</text>
<rect class="box ok" x="676" y="224" width="188" height="52" rx="8"/>
<text class="t ta b" x="770.0" y="246.5">GhostPaySweepRelayer</text>
<text class="t ta m s" x="770.0" y="263.5">gas-sponsored sweep</text>
<rect class="box  dash" x="676" y="288" width="188" height="52" rx="8"/>
<text class="t ta b" x="770.0" y="310.5">PolicyAccount (experimental)</text>
<text class="t ta m s" x="770.0" y="327.5">timelocked, no app support</text>
<rect class="box warn" x="470" y="330" width="150" height="70" rx="8"/>
<text class="t ta b" x="545.0" y="353.0">Relayer service</text>
<text class="t ta m s" x="545.0" y="370.0">optional, apps/relayer</text>
<text class="t ta m s" x="545.0" y="387.0">quotes + submits sweeps</text>
<rect class="box  dash" x="470" y="440" width="410" height="60" rx="8"/>
<text class="t ta b" x="675.0" y="466.5">Bitcoin silent payments library (BIP-352)</text>
<text class="t ta m s" x="675.0" y="483.5">tested against official vectors; not wired into the app or relayer</text>
<path class="ln " d="M139 136 L139 170" marker-end="url(#ar)"/>
<path class="ln " d="M424 241 L470 241" marker-end="url(#ar)"/>
<path class="ln " d="M620 241 L660 241" marker-end="url(#ar)"/>
<path class="ln " d="M424 365 L470 365" marker-end="url(#ar)"/>
<path class="ln " d="M620 365 L640 365 L640 262 L676 262" marker-end="url(#ar)"/>
<text class="t m s" x="24" y="540">Not shown because they do not exist: an official host, a signed release, an independent audit, a deployed contract.</text>
</svg>
