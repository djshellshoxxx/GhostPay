<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-labelledby="ttl dsc">
<title id="ttl">Policy account timelock</title>
<desc id="dsc">Experimental policy account. A stealth owner key controls an account whose funds can only leave to a fixed destination after a delay and within per-token caps. A withdrawal request must wait the delay before it can be executed and the owner can cancel in between. A destination change must wait twice the delay and can also be cancelled. Contracts and a client library only; not available in the app or relayer.</desc>
<style>
:root{--bg:#ffffff;--fg:#1b1f24;--mut:#4d5866;--box:#eef1f6;--line:#6b778a;--acc:#1f4fc4;--accbg:#dbe6ff;--warn:#8a4b00;--warnbg:#fff0d0;--bad:#a8200f;--badbg:#fde4e1;--ok:#13663a;--okbg:#dcf3e4}
@media (prefers-color-scheme:dark){:root{--bg:#0f1318;--fg:#e6e9ee;--mut:#a3aebd;--box:#1a212b;--line:#7d8a9d;--acc:#8fb2ff;--accbg:#1c2c52;--warn:#ffb454;--warnbg:#3a2a0e;--bad:#ff9b92;--badbg:#411a17;--ok:#74d9a0;--okbg:#12331f}}
svg{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.bg{fill:var(--bg)}
.t{fill:var(--fg);font-size:14px}.b{font-weight:700}.m{fill:var(--mut)}.s{font-size:12px}.h{font-size:20px;font-weight:700}
.box{fill:var(--box);stroke:var(--line);stroke-width:1.5}
.box.acc{fill:var(--accbg);stroke:var(--acc)}.box.warn{fill:var(--warnbg);stroke:var(--warn)}
.box.bad{fill:var(--badbg);stroke:var(--bad)}.box.ok{fill:var(--okbg);stroke:var(--ok)}
.dash{stroke-dasharray:6 4}
.grp{fill:none;stroke:var(--line);stroke-width:1.3;stroke-dasharray:3 5}
.ln{fill:none;stroke:var(--line);stroke-width:2}.ln.acc{stroke:var(--acc)}.ln.warn{stroke:var(--warn)}.ln.bad{stroke:var(--bad)}.ln.ok{stroke:var(--ok)}
.ah{fill:var(--line)}
.bdg{fill:var(--acc)}.bdgt{fill:var(--bg);font-size:12px;font-weight:700}
.ta{text-anchor:middle}
</style>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--line)"/></marker><marker id="ar-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--acc)"/></marker><marker id="ar-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--warn)"/></marker><marker id="ar-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--bad)"/></marker><marker id="ar-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--ok)"/></marker></defs>
<rect class="bg" width="960" height="600"/>
<text class="t h" x="24" y="34">Policy account timelock (experimental)</text>
<text class="t m s" x="24" y="54">Planned / contracts only (ADR-0014). Not in the app or relayer. Pre-audit.</text>
<rect class="box warn" x="20" y="72" width="920" height="62" rx="8"/>
<text class="t ta b" x="480.0" y="99.5">PolicyAccount: an owner key controls it, but funds can only go to a fixed destination</text>
<text class="t ta m s" x="480.0" y="116.5">delay 1 second to 30 days, optional per-token rolling-window caps, no admin, no upgrade path</text>
<text class="t b" x="24" y="180">Withdraw</text>
<rect class="box acc" x="130" y="200" width="360" height="60" rx="6" opacity="0.6"/>
<text class="t m s" x="310.0" y="194" style="text-anchor:middle">owner can cancel(id, signature)</text>
<path class="ln " d="M130 230 L910 230" marker-end="url(#ar)"/>
<circle cx="130" cy="230" r="7" fill="var(--acc)"/>
<text class="t s b" x="130" y="264" style="text-anchor:middle">t0: requestWithdraw</text>
<text class="t m s" x="130" y="282" style="text-anchor:middle">owner signs (EIP-712)</text>
<circle cx="490" cy="230" r="7" fill="var(--acc)"/>
<text class="t s b" x="490" y="264" style="text-anchor:middle">t0 + delay: executeWithdraw</text>
<text class="t m s" x="490" y="282" style="text-anchor:middle">anyone may call</text>
<circle cx="850" cy="230" r="7" fill="var(--acc)"/>
<text class="t s b" x="850" y="264" style="text-anchor:middle">paid out</text>
<text class="t m s" x="850" y="282" style="text-anchor:middle">only to destination</text>
<text class="t b" x="24" y="340">Change destination</text>
<rect class="box acc" x="130" y="360" width="720" height="60" rx="6" opacity="0.6"/>
<text class="t m s" x="490.0" y="354" style="text-anchor:middle">owner can cancelDestination(id, signature)</text>
<path class="ln " d="M130 390 L910 390" marker-end="url(#ar)"/>
<circle cx="130" cy="390" r="7" fill="var(--acc)"/>
<text class="t s b" x="130" y="424" style="text-anchor:middle">t0: proposeDestination</text>
<text class="t m s" x="130" y="442" style="text-anchor:middle">owner signs (EIP-712)</text>
<circle cx="850" cy="390" r="7" fill="var(--acc)"/>
<text class="t s b" x="915" y="424" style="text-anchor:end">t0 + 2 x delay: executeDestinationChange</text>
<text class="t m s" x="915" y="442" style="text-anchor:end">new destination takes effect</text>
<rect class="box warn" x="20" y="470" width="920" height="115" rx="8"/>
<text class="t b" x="36" y="494">What it does and does not give you</text>
<text class="t s" x="36" y="514">Does: a thief with the key cannot redirect funds or drain them faster than the caps before delay (or 2 x delay) passes.</text>
<text class="t s" x="36" y="532">Does not: hide anything. The fixed destination makes the link to it permanent and public (audit D6). Not anonymity.</text>
<text class="t s" x="36" y="550">Does not: help if you do not watch the account. The key holder, honest or not, can sign cancels, so you must act inside the window.</text>
<text class="t s" x="36" y="568">Creation costs a flat stablecoin fee (design value, owner to confirm). No audit. Do not use with real money.</text>
</svg>
