# GhostPay full-stack integration stack. DEV/TEST ONLY: public anvil dev keys, bitcoin regtest, a local Solana
# validator. No mainnet, no real keys, no secrets in this file. Drive it with scripts/integration/run-all.sh
# (which generates the regtest RPC credentials at run time and exports the variables below); running
# `docker compose` by hand needs BITCOIND_RPC_USER, BITCOIND_RPC_PASSWORD, BITCOIND_RPCAUTH (see run-all.sh).
#
#   anvil    EVM chain 31337                      official Foundry image, pinned by tag + digest
#   bitcoind Bitcoin Core regtest                 bitcoin/bitcoin Docker Hub image (UNOFFICIAL, see below)
#   solana   solana-test-validator (Agave)        built from the Anza GitHub release tarball, SHA-256 verified
#   runner   node 22 + foundry; runs the e2e     shares anvil's network namespace (so 127.0.0.1:8545 IS anvil)
#
# Hardening: no `network_mode: host`; every published port is bound to 127.0.0.1; all capabilities dropped (bitcoind
# gets back only what its entrypoint's chown/privilege drop needs); no-new-privileges; read-only root filesystems
# with tmpfs for scratch/state. The one thing that cannot be locked down: containers have outbound internet,
# because the runner downloads npm packages and the Solidity compiler (forge/svm) on first use.
#
# Never run this on a shared or public host without removing the port mappings: the dev keys are world-known.

name: ghostpay-it

x-hardened: &hardened
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  read_only: true
  restart: "no"

services:
  anvil:
    <<: *hardened
    # Official Foundry image (publisher: foundry-rs). v1.8.5 matches .github/actions/setup-forge and the runner.
    # Index digest read from ghcr.io on 2026-10-21 (resolves to linux/amd64 and linux/arm64 manifests).
    image: ghcr.io/foundry-rs/foundry:v1.8.5@sha256:32c8ea9ef052a440cb1620175987a3f49eff8b068a0c6a3d09ebf7f5f9a0e043
    # The image's own entrypoint is not relied on: run the binary directly.
    entrypoint: ["anvil"]
    command: ["--host", "0.0.0.0", "--port", "8545", "--chain-id", "31337"]
    user: "10001:10001"
    environment:
      HOME: /tmp
    tmpfs:
      - /tmp:size=256m,mode=1777
    ports:
      - "127.0.0.1:8545:8545"
    networks: [it]
    healthcheck:
      test: ["CMD", "cast", "chain-id", "--rpc-url", "http://127.0.0.1:8545"]
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 3s

  bitcoind:
    # PROVENANCE: bitcoin/bitcoin on Docker Hub is NOT published by the Bitcoin Core project. Its own README says
    # "unofficial ... not endorsed or associated with the Bitcoin Core project" and points at
    # github.com/willcl-ark/bitcoin-core-docker; the Debian variants repackage the release binaries from
    # bitcoincore.org after running contrib/verify-binaries. Bitcoin Core publishes no container image itself, and
    # bitcoincore.org was unreachable when this was written, so a self-built image with a verified tarball hash
    # was not possible. Mitigation: pinned by tag AND index digest (read from the Docker Hub API on 2026-10-21),
    # regtest only, no wallet funds of any value, no P2P listening. To avoid trusting a third party, replace
    # this with scripts/regtest/Dockerfile.bitcoind (needs a BITCOIN_SHA256 you verified from the signed SHA256SUMS).
    <<: *hardened
    image: bitcoin/bitcoin:31.1@sha256:da25cedc66b1daefff9f412ee196c901a899c3fa68a33b20849c3e08b5c40d63
    # The image forwards arguments to bitcoind. Auth is rpcauth (salted HMAC generated by run-all.sh), not a
    # plaintext -rpcpassword on the command line.
    command:
      - -regtest=1
      - -server=1
      - -printtoconsole=1
      - -listen=0
      - -dnsseed=0
      - -fixedseeds=0
      - -fallbackfee=0.0002
      - -rpcbind=0.0.0.0
      - -rpcallowip=10.241.77.0/24
      - -rpcauth=${BITCOIND_RPCAUTH:?run via scripts/integration/run-all.sh}
    cap_add: [CHOWN, SETUID, SETGID]
    environment:
      # Only for the healthcheck's bitcoin-cli; regtest, generated per run.
      BITCOIND_RPC_USER: ${BITCOIND_RPC_USER:?run via scripts/integration/run-all.sh}
      BITCOIND_RPC_PASSWORD: ${BITCOIND_RPC_PASSWORD:?run via scripts/integration/run-all.sh}
    tmpfs:
      - /home/bitcoin/.bitcoin:size=512m,mode=1777
      - /tmp:size=64m,mode=1777
    ports:
      - "127.0.0.1:18443:18443"
    networks: [it]
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bitcoin-cli -regtest -datadir=/tmp -rpcconnect=127.0.0.1 -rpcport=18443
          -rpcuser="$$BITCOIND_RPC_USER" -rpcpassword="$$BITCOIND_RPC_PASSWORD" getblockchaininfo >/dev/null
      interval: 3s
      timeout: 10s
      retries: 40
      start_period: 5s

  solana:
    <<: *hardened
    build:
      context: .
      dockerfile: Dockerfile.solana
    image: ghostpay-it/solana-test-validator:v3.1.14
    command:
      - solana-test-validator
      - --ledger=/ledger
      - --reset
      - --log
      - --bind-address=0.0.0.0
      - --rpc-port=8899
      - --faucet-port=9900
      - --limit-ledger-size=50000
    environment:
      HOME: /tmp
    tmpfs:
      - /ledger:size=2g,mode=1777
      - /tmp:size=256m,mode=1777
    ports:
      - "127.0.0.1:8899:8899"
    networks: [it]
    healthcheck:
      # No curl in the image: speak HTTP over bash's /dev/tcp (bash, not sh: dash has no /dev/tcp).
      # getHealth answers "ok" once the validator has a working bank.
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8899 &&
          body='{"jsonrpc":"2.0","id":1,"method":"getHealth"}' &&
          printf 'POST / HTTP/1.0\r\nContent-Type: application/json\r\nContent-Length: %s\r\n\r\n%s' "$${#body}" "$$body" >&3 &&
          grep -q '"result":"ok"' <&3
      interval: 5s
      timeout: 10s
      retries: 60
      start_period: 10s

  runner:
    <<: *hardened
    build:
      context: .
      dockerfile: Dockerfile.runner
      args:
        RUNNER_UID: ${RUNNER_UID:-1000}
        RUNNER_GID: ${RUNNER_GID:-1000}
    image: ghostpay-it/runner:node22-foundry1.8.5
    # Same network namespace as anvil: 127.0.0.1:8545 is the compose anvil, which is what scripts/devnet/*
    # hard-codes. Other services are reached by name (bitcoind, solana) through anvil's network.
    network_mode: "service:anvil"
    # Run as the host user so files written to the bind-mounted checkout stay owned by you (CI checkouts are not uid 1000).
    user: "${RUNNER_UID:-1000}:${RUNNER_GID:-1000}"
    working_dir: /work
    entrypoint: ["bash"]
    command: ["scripts/integration/run-in-runner.sh"]
    environment:
      HOME: /home/runner
      CI: "true"
      BITCOIND_RPC_URL: http://bitcoind:18443
      BITCOIND_RPC_USER: ${BITCOIND_RPC_USER:?run via scripts/integration/run-all.sh}
      BITCOIND_RPC_PASSWORD: ${BITCOIND_RPC_PASSWORD:?run via scripts/integration/run-all.sh}
      SOLANA_RPC_URL: http://solana:8899
      DEVNET_PORT: "8545"
      INTEGRATION_SUITES: ${INTEGRATION_SUITES:-evm,btc,solana}
    volumes:
      - ../..:/work:rw
      - ${INTEGRATION_HOME:-/tmp/ghostpay-integration-home}:/home/runner:rw
    tmpfs:
      - /tmp:size=1g,mode=1777
    depends_on:
      anvil: {condition: service_healthy}
      bitcoind: {condition: service_healthy}
      solana: {condition: service_healthy}

networks:
  it:
    driver: bridge
    ipam:
      config:
        - subnet: 10.241.77.0/24
