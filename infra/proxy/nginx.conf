# nginx alternative to the Caddyfile. Same header set. Not deployed; validate with: nginx -t -c <abs path>
# (nginx not installed in the authoring sandbox, so this file is UNVALIDATED).
# Include inside http { } or use as a full config. OWNER: set server_name and TLS paths.

worker_processes auto;
pid /tmp/nginx.pid;
events { worker_connections 1024; }

http {
	include       mime.types;
	default_type  application/octet-stream;
	server_tokens off;
	access_log    off;                       # no URL logs
	client_max_body_size 64k;                # relayer bodies are small JSON
	limit_req_zone $binary_remote_addr zone=relayer:10m rate=10r/s;

	server {
		listen 80;
		server_name ghostpay.example.invalid;   # OWNER
		return 301 https://$host$request_uri;
	}

	server {
		listen 443 ssl;
		http2 on;
		server_name ghostpay.example.invalid;   # OWNER
		ssl_certificate     /etc/ssl/ghostpay/fullchain.pem;   # OWNER
		ssl_certificate_key /etc/ssl/ghostpay/privkey.pem;     # OWNER
		ssl_protocols TLSv1.2 TLSv1.3;
		ssl_prefer_server_ciphers off;

		root /srv/ghostpay;

		# add_header is not inherited into a location that sets its own add_header, so the shared header set lives in
		# ghostpay-headers.conf (same directory contents) and every location includes it.

		location = /index.html {
			include /etc/nginx/ghostpay-headers.conf;
			add_header Cache-Control "no-cache" always;
		}
		location /assets/ {
			include /etc/nginx/ghostpay-headers.conf;
			add_header Cross-Origin-Resource-Policy "same-origin" always;
			add_header Cache-Control "public, max-age=31536000, immutable" always;
		}
		location /deployments/ {
			include /etc/nginx/ghostpay-headers.conf;
			add_header Cross-Origin-Resource-Policy "same-origin" always;
			add_header Cache-Control "no-store" always;
		}
		location = /ghostpay-embed-v1.js {
			include /etc/nginx/ghostpay-headers.conf;
			add_header Cross-Origin-Resource-Policy "cross-origin" always;
			add_header Cache-Control "public, max-age=3600" always;
		}

		# Relayer: exact routes only; /metrics is never exposed. The relayer must list 127.0.0.1 in
		# trustedProxies and listen on 127.0.0.1 only.
		location ~ ^/(healthz|v1/info|v1/quote|v1/sweep)$ {
			include /etc/nginx/ghostpay-headers.conf;
			limit_req zone=relayer burst=20 nodelay;
			proxy_pass http://127.0.0.1:8787;
			proxy_http_version 1.1;
			proxy_set_header Host $host;
			proxy_set_header X-Forwarded-For $remote_addr;   # overwrite, never $proxy_add_x_forwarded_for
			proxy_set_header X-Real-IP "";
			proxy_set_header Forwarded "";
			proxy_connect_timeout 3s;
			proxy_read_timeout 30s;
		}
		location = /metrics { return 404; }

		location / {
			include /etc/nginx/ghostpay-headers.conf;
			add_header Cache-Control "no-cache" always;
			try_files $uri /index.html;
		}
	}
}
