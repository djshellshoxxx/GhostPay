# UNTESTED: no Docker daemon was available when this file was written. Build context = repository root.
# LOCAL DEVELOPMENT ONLY. Every key below is the public anvil dev key set; funds on it are worthless by design.
name: ghostpay-devnet

services:
  anvil:
    build:
      context: ../..
      dockerfile: infra/devnet/Dockerfile.anvil
    command: ["anvil", "--host", "0.0.0.0", "--port", "8545", "--chain-id", "31337"]
    ports:
      - "127.0.0.1:8545:8545"
    healthcheck:
      test: ["CMD", "cast", "chain-id", "--rpc-url", "http://127.0.0.1:8545"]
      interval: 2s
      timeout: 2s
      retries: 30

  deploy:
    build:
      context: ../..
      dockerfile: infra/devnet/Dockerfile.anvil
    depends_on:
      anvil:
        condition: service_healthy
    working_dir: /repo/packages/contracts
    environment:
      FEE_RECIPIENT: "0x70997970C51812dc3A010C7d01b50e0d17dc79C8"
      RPC_URL: "http://anvil:8545"
      # public anvil account 0 key (devnet only)
      DEV_DEPLOYER_KEY: "0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80"
    command:
      - bash
      - -ec
      - |
        forge script script/devnet/DeployDevnet.s.sol:DeployDevnet --rpc-url "$$RPC_URL" --broadcast --private-key "$$DEV_DEPLOYER_KEY" --slow
        node /repo/scripts/testnet/make-manifest.mjs --rpc "$$RPC_URL" \
          --broadcast /repo/packages/contracts/broadcast/DeployDevnet.s.sol/31337/run-latest.json \
          --out /shared/deployments/31337.json
        node /repo/scripts/devnet/write-state.mjs /repo/packages/contracts/broadcast/DeployDevnet.s.sol/31337/run-latest.json /shared/devnet.json "$$RPC_URL"
    volumes:
      - shared:/shared
    restart: "no"

  relayer:
    build:
      context: ../..
      dockerfile: apps/relayer/Dockerfile
    depends_on:
      deploy:
        condition: service_completed_successfully
    environment:
      RELAYER_CONFIG: /shared/relayer.config.json
      DEPLOYMENTS_DIR: /shared/deployments
      # public anvil account 3 key / throwaway quote secret (devnet only)
      RELAYER_KEY: "0x7c852118294e51e653712a81e05800f419141751be58f605c371e15141b007a6"
      QUOTE_SECRET: "0707070707070707070707070707070707070707070707070707070707070707"
    volumes:
      - shared:/shared:ro
    ports:
      - "127.0.0.1:8787:8787"
    # NOTE: /shared/relayer.config.json is not generated by this compose file yet; copy the one that
    # scripts/devnet/e2e.mjs writes to scripts/devnet/.state/relayer.config.json (rpcUrl -> http://anvil:8545,
    # listen.host -> 0.0.0.0) into the volume. Untested.

  web:
    build:
      context: ../..
      dockerfile: infra/devnet/Dockerfile.web
    depends_on:
      deploy:
        condition: service_completed_successfully
    volumes:
      - shared:/shared:ro
    ports:
      - "127.0.0.1:4173:4173"

volumes:
  shared:
