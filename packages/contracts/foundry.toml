[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
# Offline sandbox uses a local static solc. CI uses `solc_version = "0.8.28"` instead (see README).
solc = "/home/user/tools/solc"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
cbor_metadata = false
ffi = false
fs_permissions = []

[fuzz]
runs = 10000

[invariant]
runs = 256
depth = 50
fail_on_revert = false

[profile.dev.fuzz]
runs = 256

[profile.dev.invariant]
runs = 64
depth = 50

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = false
int_types = "long"
multiline_func_header = "attributes_first"
quote_style = "double"
number_underscore = "thousands"
