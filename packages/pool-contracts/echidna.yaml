# Echidna config for test/echidna/EchidnaPool.sol (local only, not in CI). Echidna's EVM runs at chain id 1,
# which the pool constructor refuses, so the pool is constructed on a LOCAL anvil first and Echidna forks it:
#   anvil --port 8546 &
#   forge script test/echidna/EchidnaFixture.s.sol --rpc-url http://127.0.0.1:8546 --broadcast \
#     --private-key 0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80   # anvil account 0 (public test key)
#   echidna test/echidna/EchidnaPool.sol --contract EchidnaPool --config echidna.yaml
# (needs crytic-compile on PATH and FOUNDRY_SOLC pointing at a local solc 0.8.28 offline)
testMode: property
testLimit: 100000
seqLen: 40
shrinkLimit: 2000
workers: 4
seed: 20261021
sender: ["0x10000", "0x20000", "0x30000"]
deployer: "0x40000"
rpcUrl: "http://127.0.0.1:8546"
rpcBlock: 2
