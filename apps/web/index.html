      <main id="content">
        <h2>This app needs JavaScript</h2>
        <p>
          The GhostPay web interface uses JavaScript and the Web Crypto API to create keys, open signed invoices,
          review transactions and scan payments. This page cannot perform those actions while JavaScript is disabled.
          The project also has separate command-line and operator tools; their supported commands are documented
          in the <a href="https://github.com/djshellshoxxx/GhostPay">source repository</a>.
        </p>
        <p>
          Use a compatible graphical browser on a secure origin to run the web app. The help and privacy pages
          linked above work without JavaScript. Browser support and deployment verification are separate requirements:
          enabling JavaScript does not enable a network whose deployment has not been verified.
        </p>
        <h2>Keep the original records</h2>
        <p>
          Save the original invoice and digital receipt files. A transaction hash is a reference used to look up a
          transaction; it does not by itself prove that the correct recipient received the correct asset and amount.
          A seller receipt signature establishes control of the signing key and the signed fields, not independent
          payment verification. A QR image is a convenient representation of data, so retain the original file too.
        </p>
      </main>
    </noscript>
