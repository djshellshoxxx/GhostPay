  <body>
    <div id="root"></div>
    <noscript>
      <a class="skip" href="#content">Skip to main content</a>
      <header class="site-header">
        <h1>GhostPay</h1>
        <p>Stealth-address payments. Experimental, unaudited testnet software.</p>
      </header>
      <nav class="site-nav" aria-label="Help without JavaScript">
        <ul>
          <li><a href="help.html">Help: paying an invoice, receiving, troubleshooting</a></li>
          <li><a href="privacy.html">Privacy: what this app does and does not hide</a></li>
        </ul>
      </nav>
      <main id="content" tabindex="-1">
        <h2>This app needs JavaScript</h2>
        <p>
          The GhostPay web app uses JavaScript and the Web Crypto API to create keys, open signed invoices, review
          transactions and scan for payments. With JavaScript off, this page cannot do those things. The help and
          privacy pages linked above work without it. Enabling JavaScript does not enable a network whose deployment
          has not been verified.
        </p>
        <h2>In plain words</h2>
        <p>
          A seller asks to be paid with a signed invoice. The buyer pays from their own wallet to a new address made for
          that one payment. The seller later finds the payment with a private key kept in their browser. The blockchain
          is public, so the payment itself can still be seen by anyone.
        </p>
        <h2>Buyer and seller steps</h2>
        <div class="flow-lanes">
          <section class="flow-lane" aria-labelledby="noscript-seller">
            <h3 id="noscript-seller">Seller</h3>
            <ol class="flow">
              <li><strong>Set up keys and save an encrypted keystore.</strong></li>
              <li><strong>Create a signed invoice</strong> with the network, amount, line items and expiry.</li>
              <li><strong>Share the original invoice</strong> through a channel you trust.</li>
              <li><strong>Find and review the payment</strong> with your viewing key, then keep the records.</li>
            </ol>
          </section>
          <section class="flow-lane" aria-labelledby="noscript-buyer">
            <h3 id="noscript-buyer">Buyer</h3>
            <ol class="flow">
              <li><strong>Open the original invoice</strong> and check its network, amount and expiry.</li>
              <li><strong>Connect your wallet</strong> on the invoice's network.</li>
              <li><strong>Approve only the reviewed action</strong> in your wallet.</li>
              <li><strong>Keep the transaction reference</strong> and check the state the app shows.</li>
            </ol>
          </section>
        </div>
        <h2>More detail</h2>
        <p>
          Test with test networks and test funds only. A verified deployment is required before payments can proceed,
          and a listed network does not prove that one exists. Read the
          <a href="help.html">help guide</a> for backups, wallet steps, RPC settings and what each status means, and the
          <a href="privacy.html">privacy matrix</a> for what each feature reveals.
        </p>
        <details>
          <summary>Technical summary</summary>
          <div class="technical">
            <p>
              Invoices can be plain, bearer-encrypted (the key follows the # in the link and never reaches a server), or
              passphrase-protected (scrypt N = 2^17 with AES-256-GCM). Keystores use the same scrypt and AES-GCM
              parameters. Payments route through a router contract that takes a 0.25% fee on each router payment, and
              scanning uses your viewing key against public announcements.
            </p>
          </div>
        </details>
        <h2>Keep the original records</h2>
        <p>
          Save the original invoice and digital receipt files. A transaction hash is a reference used to look up a
          transaction; it does not by itself prove that the correct recipient received the correct asset and amount.
          A seller receipt signature establishes control of the signing key and the signed fields, not independent
          payment verification. A QR image is a convenient representation of data, so retain the original file too.
        </p>
      </main>
    </noscript>
