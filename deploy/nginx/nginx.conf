# GhostPay self-host: static web bundle + reverse proxy to the API. Runs as non-root (nginx-unprivileged), read-only fs.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 256; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # Privacy: no access log (no IPs, URLs or timing are written). Errors go to stderr only.
  access_log off;
  server_tokens off;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path       /tmp/proxy_temp;
  fastcgi_temp_path     /tmp/fastcgi_temp;
  uwsgi_temp_path       /tmp/uwsgi_temp;
  scgi_temp_path        /tmp/scgi_temp;

  client_max_body_size 64k;
  client_body_timeout 10s;
  client_header_timeout 10s;
  keepalive_timeout 15s;
  send_timeout 15s;

  server {
    listen 8080 default_server;
    server_name _;
    root /usr/share/ghostpay/web;
    index index.html;
    include /etc/nginx/ghostpay/security-headers.conf;

    location = /index.html {
      include /etc/nginx/ghostpay/security-headers.conf;
      add_header Cache-Control "no-cache" always;
    }
    location /assets/ {
      include /etc/nginx/ghostpay/security-headers.conf;
      add_header Cross-Origin-Resource-Policy "same-origin" always;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      try_files $uri =404;
    }
    location /deployments/ {
      include /etc/nginx/ghostpay/security-headers.conf;
      add_header Cross-Origin-Resource-Policy "same-origin" always;
      add_header Cache-Control "no-store" always;
      try_files $uri =404;
    }
    # Embed SDK: loaded cross-origin by merchant pages; CORS (no credentials) so integrity=... crossorigin="anonymous" works.
    location = /ghostpay-embed-v1.js {
      include /etc/nginx/ghostpay/security-headers.conf;
      add_header Cross-Origin-Resource-Policy "cross-origin" always;
      add_header Access-Control-Allow-Origin "*" always;
      add_header Cache-Control "public, max-age=3600" always;
    }
    location = /ghostpay-embed-v2.js {
      include /etc/nginx/ghostpay/security-headers.conf;
      add_header Cross-Origin-Resource-Policy "cross-origin" always;
      add_header Access-Control-Allow-Origin "*" always;
      add_header Cache-Control "public, max-age=3600" always;
    }

    # Client address (audit L5-05). The TLS terminator on the host reaches this container through the published port,
    # so the peer is a gateway pinned in docker-compose.yml (the host); the terminator must put its own peer last in
    # X-Forwarded-For (overwrite or append). Believe that header from the gateways only: any other peer, such as the
    # Tor container, is the client itself. The relayer in turn trusts X-Forwarded-For only from the backend subnet (its trustedProxies).
    set_real_ip_from 172.30.10.1;
    set_real_ip_from 172.30.11.1;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Reverse proxy to the API container (internal network only): exactly the four public routes, prefix /api
    # stripped (audit L7-L3). Every other /api/ path is 404, /api/metrics included: scrape /metrics from inside the
    # backend network (deploy/config/README.md).
    location ~ ^/api/(healthz|v1/info|v1/quote|v1/sweep)$ {
      include /etc/nginx/ghostpay/security-headers.conf;
      add_header Cache-Control "no-store" always;
      limit_except GET POST OPTIONS { deny all; }
      rewrite ^/api(/.*)$ $1 break;
      proxy_pass http://api:8787;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;   # overwrite: the client address resolved above
      proxy_set_header X-Real-IP "";
      proxy_set_header Forwarded "";
      proxy_set_header Connection "";
      proxy_read_timeout 30s;
      proxy_connect_timeout 5s;
      proxy_hide_header X-Powered-By;
    }
    location /api/ {
      include /etc/nginx/ghostpay/security-headers.conf;
      add_header Cache-Control "no-store" always;
      return 404;
    }

    location / {
      include /etc/nginx/ghostpay/security-headers.conf;
      try_files $uri $uri/ /index.html;
    }

    # Never serve dotfiles or source maps.
    location ~ /\. { deny all; }
    location ~ \.map$ { deny all; }
  }
}
