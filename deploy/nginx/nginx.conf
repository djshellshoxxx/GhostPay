# GhostPay self-host: static web bundle + reverse proxy to the API. Runs as non-root (nginx-unprivileged), read-only fs.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 256; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # Privacy: no access log (no IPs, URLs or timing are written). Errors go to stderr only.
  access_log off;
  server_tokens off;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path       /tmp/proxy_temp;
  fastcgi_temp_path     /tmp/fastcgi_temp;
  uwsgi_temp_path       /tmp/uwsgi_temp;
  scgi_temp_path        /tmp/scgi_temp;

  client_max_body_size 64k;
  client_body_timeout 10s;
  client_header_timeout 10s;
  keepalive_timeout 15s;
  send_timeout 15s;

  server {
    listen 8080 default_server;
    server_name _;
    root /usr/share/ghostpay/web;
    index index.html;
    include /etc/nginx/ghostpay/security-headers.conf;

    location = /index.html {
      include /etc/nginx/ghostpay/security-headers.conf;
      add_header Cache-Control "no-cache" always;
    }
    location /assets/ {
      include /etc/nginx/ghostpay/security-headers.conf;
      add_header Cross-Origin-Resource-Policy "same-origin" always;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      try_files $uri =404;
    }
    location /deployments/ {
      include /etc/nginx/ghostpay/security-headers.conf;
      add_header Cross-Origin-Resource-Policy "same-origin" always;
      add_header Cache-Control "no-store" always;
      try_files $uri =404;
    }
    location = /ghostpay-embed-v1.js {
      include /etc/nginx/ghostpay/security-headers.conf;
      add_header Cross-Origin-Resource-Policy "cross-origin" always;
      add_header Cache-Control "public, max-age=3600" always;
    }
    location = /ghostpay-embed-v2.js {
      include /etc/nginx/ghostpay/security-headers.conf;
      add_header Cross-Origin-Resource-Policy "cross-origin" always;
      add_header Cache-Control "public, max-age=3600" always;
    }

    # Reverse proxy to the API container (internal network only). Prefix /api/ is stripped.
    location /api/ {
      include /etc/nginx/ghostpay/security-headers.conf;
      add_header Cache-Control "no-store" always;
      limit_except GET POST OPTIONS { deny all; }
      proxy_pass http://api:8787/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header Connection "";
      proxy_read_timeout 30s;
      proxy_connect_timeout 5s;
      proxy_hide_header X-Powered-By;
    }

    location / {
      include /etc/nginx/ghostpay/security-headers.conf;
      try_files $uri $uri/ /index.html;
    }

    # Never serve dotfiles or source maps.
    location ~ /\. { deny all; }
    location ~ \.map$ { deny all; }
  }
}
