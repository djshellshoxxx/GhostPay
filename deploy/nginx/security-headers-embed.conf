# OPT-IN variant of security-headers.conf for a header-capable host that serves the iframe embed (spec 14, Roadmap Feature 2).
# Use it INSTEAD of security-headers.conf (same include path) and build the web app with VITE_EMBED_IFRAME=1.
# Differences: frame-ancestors is an explicit allowlist from $gp_frame_ancestors and X-Frame-Options is omitted
# (it cannot express an allowlist, and a conflicting DENY would block every merchant).
# Define the map once in the http block, listing only merchant origins you reviewed (never "*", never a scheme-only source):
#   map $host $gp_frame_ancestors { default "https://shop.example https://pay.merchant.example"; }
# The checkout also requires a signed merchant profile whose `origins` contains the embedding origin; the allowlist here is
# the browser-enforced layer, the profile is the application layer.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' https: wss:; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors $gp_frame_ancestors; worker-src 'self'" always;
add_header Referrer-Policy "no-referrer" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Permissions-Policy "accelerometer=(), autoplay=(), bluetooth=(), camera=(), display-capture=(), geolocation=(), gyroscope=(), hid=(), magnetometer=(), microphone=(), midi=(), payment=(), serial=(), usb=(), xr-spatial-tracking=()" always;
# No Cross-Origin-Opener-Policy here: it does not apply to a framed page; the top-level popup is still isolated by the SDK's noopener.
