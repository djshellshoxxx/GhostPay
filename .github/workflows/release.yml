name: Release
# Runs on a pushed version tag. Produces a DRAFT GitHub release with a deterministic web-bundle tarball,
# SHA256SUMS, CycloneDX SBOM, release-manifest.json and a build-provenance attestation.
#
# The tag signature IS cryptographically verified (scripts/verify-tag.sh) against the pinned trust root
# .github/release-signers/allowed_signers, read from the default branch. That file ships with no key: until the owner
# adds the release-signing public key, every run fails closed at the tag check (human gate).
#
# It does NOT publish anywhere: no IPFS, ENS, Tor or Pages (hosting is intentionally not enabled; see the
# disabled stub at the bottom). A maintainer must approve the `release` environment (Settings > Environments >
# release > Required reviewers) before the build and draft jobs run, and must publish the draft by hand.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify (tests on a clean checkout)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0   # full history: the tagged commit must be reachable from the default branch
      - name: Verify tag signature against the pinned trust root (default-branch copy)
        id: tagcheck
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          # actions/checkout may leave a lightweight ref; fetch the tag object itself (read-only token), plus the
          # default branch. The verifier and the trust root are taken from the DEFAULT BRANCH, not from the tagged
          # commit, so a tag on an unreviewed commit cannot bring its own key or its own verifier.
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" fetch --force --no-tags origin \
            "+refs/tags/$TAG:refs/tags/$TAG" "+refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH"
          base="refs/remotes/origin/$DEFAULT_BRANCH"
          trust="$RUNNER_TEMP/release-trust"
          mkdir -p "$trust"
          if ! git show "$base:scripts/verify-tag.sh" > "$trust/verify-tag.sh"; then
            echo "::error::scripts/verify-tag.sh is not on $DEFAULT_BRANCH; merge it before releasing"; exit 1
          fi
          # A missing file becomes an empty trust root, which verify-tag.sh rejects (fail closed).
          git show "$base:.github/release-signers/allowed_signers" > "$trust/allowed_signers" 2>/dev/null || : > "$trust/allowed_signers"
          git show "$base:.github/release-signers/pgp-keys.asc" > "$trust/pgp-keys.asc" 2>/dev/null || rm -f "$trust/pgp-keys.asc"
          # Signed by a pinned key, annotated, named $TAG, pointing at the checked-out commit, reachable from the
          # default branch. Adding the first key is an owner action (.github/release-signers/README.md).
          bash "$trust/verify-tag.sh" --allowed-signers "$trust/allowed_signers" --pgp-keys "$trust/pgp-keys.asc" \
            --ancestor-of "$base" "$TAG" "$(git rev-parse HEAD)"
          echo "tag_object=$(git rev-parse "refs/tags/$TAG")" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: v1.8.5
      - run: npm ci --ignore-scripts
      - run: npm run build:libs
      - name: Contract build, tests and anvil artifacts
        working-directory: packages/contracts
        run: |
          forge fmt --check
          forge build --sizes
          forge test
      - name: Locate anvil
        run: echo "ANVIL_BIN=$(command -v anvil)" >> "$GITHUB_ENV"
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
        env:
          REQUIRE_ANVIL: "1"
      - name: Release tooling tests (verify-tag, verify-release, manifest channel)
        run: node --test scripts/tests/release-*.test.mjs
      - run: bash scripts/scan-secrets.sh
      - run: bash scripts/check-actions-pinned.sh
      - run: npm audit --omit=dev --audit-level=high

  build:
    name: Build, attest (requires approval)
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: release
    permissions:
      contents: read
      id-token: write       # sigstore signing identity for the attestation
      attestations: write   # store the attestation
    outputs:
      tag_object: ${{ steps.tagcheck.outputs.tag_object }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Re-verify the tag after approval (it may have moved while waiting)
        id: tagcheck
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          # actions/checkout may leave a lightweight ref; fetch the tag object itself (read-only token), plus the
          # default branch. The verifier and the trust root are taken from the DEFAULT BRANCH, not from the tagged
          # commit, so a tag on an unreviewed commit cannot bring its own key or its own verifier.
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" fetch --force --no-tags origin \
            "+refs/tags/$TAG:refs/tags/$TAG" "+refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH"
          base="refs/remotes/origin/$DEFAULT_BRANCH"
          trust="$RUNNER_TEMP/release-trust"
          mkdir -p "$trust"
          if ! git show "$base:scripts/verify-tag.sh" > "$trust/verify-tag.sh"; then
            echo "::error::scripts/verify-tag.sh is not on $DEFAULT_BRANCH; merge it before releasing"; exit 1
          fi
          # A missing file becomes an empty trust root, which verify-tag.sh rejects (fail closed).
          git show "$base:.github/release-signers/allowed_signers" > "$trust/allowed_signers" 2>/dev/null || : > "$trust/allowed_signers"
          git show "$base:.github/release-signers/pgp-keys.asc" > "$trust/pgp-keys.asc" 2>/dev/null || rm -f "$trust/pgp-keys.asc"
          # Signed by a pinned key, annotated, named $TAG, pointing at the checked-out commit, reachable from the
          # default branch. Adding the first key is an owner action (.github/release-signers/README.md).
          bash "$trust/verify-tag.sh" --allowed-signers "$trust/allowed_signers" --pgp-keys "$trust/pgp-keys.asc" \
            --ancestor-of "$base" "$TAG" "$(git rev-parse HEAD)"
          echo "tag_object=$(git rev-parse "refs/tags/$TAG")" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: v1.8.5
      - name: Deterministic release build
        env:
          VERSION: ${{ github.ref_name }}
          OUT_DIR: ${{ github.workspace }}/release-out
          GP_REQUIRE_RELEASE: "1"   # fail unless the manifest channel is "release" (tagged commit, clean tree)
        run: bash scripts/release-build.sh
      - name: Self-check the produced artifacts
        env:
          TAG: ${{ github.ref_name }}
        run: |
          (cd release-out && sha256sum --check SHA256SUMS)
          bash scripts/verify-release.sh "release-out/ghostpay-web-$TAG.tar.gz" release-out/SHA256SUMS \
            "$(git rev-parse HEAD)" release-out/release-manifest.json
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: release-out/SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-artifacts
          path: release-out/
          if-no-files-found: error
          retention-days: 30

  draft-release:
    name: Draft GitHub release (requires approval)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write   # create the draft release only
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-artifacts
          path: release-out
      - name: Tag must still be the verified tag object for the built commit
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          VERIFIED_TAG_OBJECT: ${{ needs.build.outputs.tag_object }}
        run: |
          set -euo pipefail
          [[ "$VERIFIED_TAG_OBJECT" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::no verified tag object from the build job"; exit 1; }
          ref="$(gh api "repos/$REPO/git/ref/tags/$TAG" --jq '.object.type + " " + .object.sha')"
          if [ "$ref" != "tag $VERIFIED_TAG_OBJECT" ]; then
            echo "::error::refs/tags/$TAG is now '$ref'; the build verified tag object $VERIFIED_TAG_OBJECT"; exit 1
          fi
          tagged="$(gh api "repos/$REPO/git/tags/$VERIFIED_TAG_OBJECT" --jq '.object.sha')"
          manifest_commit="$(jq -r .commit release-out/release-manifest.json)"
          channel="$(jq -r .channel release-out/release-manifest.json)"
          [ "$tagged" = "$manifest_commit" ] || { echo "::error::tag points at $tagged, manifest records $manifest_commit"; exit 1; }
          [ "$channel" = "release" ] || { echo "::error::manifest channel is '$channel', not release"; exit 1; }
      - name: Create DRAFT release (never published automatically)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          cd release-out
          gh release create "$TAG" --repo "$REPO" --verify-tag --draft --title "$TAG" \
            --notes "Draft. Verify before publishing: see docs/operators/release-and-verify.md. Hosting is not enabled for this release." \
            ./*

  # ---------------------------------------------------------------------------------------------------------
  # DISABLED STUB - DO NOT ENABLE WITHOUT AN EXPLICIT OWNER DECISION.
  # Static publication (IPFS pin / ENS update / Tor mirror / Pages) is intentionally not enabled. Enabling it
  # needs: a written owner decision, protected environments (ipfs-publish, tor-publish), scoped pinning
  # credentials (prefer OIDC), and the CSP/header checks in docs/SECURITY_QA_DEVOPS_PLAYBOOK.md section 2
  # (stages 5-6 and the security notes). Hosting hosts that cannot set response headers weaken the CSP.
  # See docs/operators/release-and-verify.md "Hosting is disabled".
  #
  # publish-static:
  #   if: false   # remove only after the owner decision is recorded in docs/adr/
  #   needs: [draft-release]
  #   environment: ipfs-publish
  #   runs-on: ubuntu-latest
  #   permissions:
  #     contents: read
  #   steps:
  #     - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
  #     - run: ./scripts/verify-release.sh ...   # re-verify the artifact before any publication
  #     # pin step intentionally absent: the owner chooses the provider and credentials.
