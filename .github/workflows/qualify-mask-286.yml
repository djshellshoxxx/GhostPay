name: Issue 286 integrated masking qualification
on:
  push:
    branches: [qa/286-integrated-mask-verification]
permissions:
  contents: read
concurrency:
  group: qualify-mask-286
  cancel-in-progress: true
jobs:
  masking:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    env:
      CANDIDATE: 6df0c30afdc36585feb7c0ca4853c0ffbc849b14
      BASELINE: 75b876bd1da2c010faf43e3eb3b4f51fa15081fc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 6df0c30afdc36585feb7c0ca4853c0ffbc849b14
          persist-credentials: false
      - uses: ./.github/actions/setup-node-libs
        with:
          save-cache: 'false'
      - run: ./node_modules/.bin/playwright install --with-deps chromium
      - name: Unit and integration acceptance
        working-directory: apps/web
        run: |
          ../../node_modules/.bin/vitest run --maxWorkers=2 src/lib/privacyMode.test.tsx src/AppShell.privacy.test.tsx src/AppShell.quickHide.test.tsx src/views/Pay.masking.test.tsx src/views/WalletPrivacy.lifecycle.test.tsx src/components/WalletDisclosure.quickHide.test.tsx src/components/ReconciliationLedger.privacy.test.tsx src/components/WalletAttempts.test.tsx src/components/PrivacyQuickHide.test.tsx src/views/Settings.clipboardPrivacy.test.tsx
      - name: Full Pages masking and disclosure
        if: ${{ !cancelled() }}
        working-directory: apps/web
        env:
          GHOSTPAY_LOCAL_BUILD_PROFILE: full
        run: ../../node_modules/.bin/playwright test --project=desktop privacy-mask-history.spec.ts wallet-disclosure.spec.ts
      - name: Lean Pages masking and disclosure
        if: ${{ !cancelled() }}
        working-directory: apps/web
        env:
          GHOSTPAY_LOCAL_BUILD_PROFILE: lean
        run: ../../node_modules/.bin/playwright test --project=desktop privacy-mask-history.spec.ts wallet-disclosure.spec.ts
      - name: Verify pre-fix disclosure with the test-first commit
        if: ${{ !cancelled() }}
        env:
          GHOSTPAY_LOCAL_BUILD_PROFILE: lean
        run: |
          set -euo pipefail
          git fetch --depth=1 origin "$BASELINE"
          git switch --detach "$BASELINE"
          cd apps/web
          if ../../node_modules/.bin/playwright test --project=desktop privacy-mask-history.spec.ts --grep 'preserves seller keys' > "$RUNNER_TEMP/masking-red.log" 2>&1; then
            echo "Expected the baseline to disclose the fixture in the document"
            exit 1
          fi
          grep -q 'assertMaskedDocument.ts' "$RUNNER_TEMP/masking-red.log"
          grep -q 'not.toContain' "$RUNNER_TEMP/masking-red.log"
          echo "Confirmed the original failure in the hidden document assertion at $BASELINE."
