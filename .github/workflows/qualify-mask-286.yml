name: Issue 286 complete web regression suites
on:
  push:
    branches: [qa/286-integrated-mask-verification]
permissions:
  contents: read
concurrency:
  group: qualify-mask-286-web-regressions
  cancel-in-progress: true
jobs:
  browsers:
    strategy:
      fail-fast: false
      matrix:
        profile: [full, lean]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: c30283d28ec15f0c4fddb8a80d1c5f60ee590401
          persist-credentials: false
      - uses: ./.github/actions/setup-node-libs
        with:
          save-cache: 'false'
      - run: ./node_modules/.bin/playwright install --with-deps chromium
      - run: npm run test:e2e --workspace @ghostpay/web
        env:
          GHOSTPAY_LOCAL_BUILD_PROFILE: ${{ matrix.profile }}
  web-tests:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: c30283d28ec15f0c4fddb8a80d1c5f60ee590401
          persist-credentials: false
      - uses: ./.github/actions/setup-node-libs
        with:
          save-cache: 'false'
      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf
        with:
          version: v1.8.5
      - working-directory: packages/contracts
        run: forge build
      - name: Web coverage and integration tests
        run: |
          set -euo pipefail
          export ANVIL_BIN="$(command -v anvil)"
          export SOLC_BIN="$HOME/.svm/0.8.28/solc-0.8.28"
          test -x "$ANVIL_BIN"
          test -x "$SOLC_BIN"
          REQUIRE_ANVIL=1 npm test -w apps/web
