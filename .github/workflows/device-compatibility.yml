name: Native browser compatibility
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tools/device-compatibility/**'
      - '.github/workflows/device-compatibility.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node-libs
      - name: Build the pinned lean client
        run: npm run build -w @ghostpay/web
        env:
          GP_COMMIT: ${{ github.sha }}
          GHOSTPAY_LOCAL_BUILD_PROFILE: lean
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: compatibility-build
          path: apps/web/dist
          if-no-files-found: error
          retention-days: 5
  native:
    needs: build
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-2025, browser: edge}
          - {os: windows-2025, browser: chrome}
          - {os: windows-2025, browser: firefox}
          - {os: macos-15, browser: safari}
          - {os: macos-15, browser: chrome}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: compatibility-build
          path: qa-build
      - name: Enable Safari automation on the disposable macOS runner
        if: matrix.browser == 'safari'
        run: sudo safaridriver --enable
      - name: Test the installed browser
        shell: bash
        run: python3 tools/device-compatibility/native.py --browser "${{ matrix.browser }}" --build qa-build --output native-result.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: compatibility-${{ matrix.os }}-${{ matrix.browser }}
          path: native-result.json
          if-no-files-found: warn
          retention-days: 14
