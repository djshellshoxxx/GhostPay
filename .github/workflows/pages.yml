name: Pages mirror
# DEGRADED MIRROR of apps/web on GitHub Pages (project site, base path /GhostPay/). Not the primary host.
# GitHub Pages cannot set response headers: only the <meta http-equiv="Content-Security-Policy"> in index.html
# applies. frame-ancestors, X-Frame-Options, X-Content-Type-Options, Permissions-Policy, COOP/CORP and
# Cache-Control cannot be set, so clickjacking protection is absent and the iframe embed mode is unavailable
# (see docs/operators/mirror-hosting.md and docs/operators/hosting.md). Use infra/proxy for a real host.
#
# Manual deployment only; merging source must not publish a site without separate deployment authorization.
# Runs from main only. Prerequisite (OWNER): Settings > Pages > Source = "GitHub Actions", and the
# `github-pages` environment restricted to the main branch. Until then the deploy job fails closed.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build and scan
    # Belt and braces: workflow_dispatch can be started from any ref; only main may build a publishable bundle.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Actions are pinned to full SHAs
        run: bash scripts/check-actions-pinned.sh
      - uses: ./.github/actions/setup-node-libs
      - name: Build apps/web (typecheck, vite build, postbuild bundle scan)
        run: npm run build -w apps/web
      - name: Bundle scan (explicit re-run on dist)
        run: node apps/web/scripts/scan-bundle.mjs
      - name: Dist must contain the CSP meta and no source maps
        run: |
          set -euo pipefail
          d=apps/web/dist
          grep -q 'http-equiv="Content-Security-Policy"' "$d/index.html"
          grep -q "script-src 'self'" "$d/index.html"
          if find "$d" -name '*.map' | grep -q .; then echo "::error::source map in dist"; exit 1; fi
      - name: Record file hashes (compare from a separate machine)
        run: |
          set -euo pipefail
          cd apps/web/dist
          find . -type f | LC_ALL=C sort | xargs sha256sum > "$RUNNER_TEMP/SHA256SUMS"
          { echo '### SHA256SUMS of served files'; echo '```'; cat "$RUNNER_TEMP/SHA256SUMS"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/web/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
