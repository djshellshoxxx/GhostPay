name: November audit independent payment-state verification

on:
  pull_request:
    branches: [audit/nov27-six-finding-integration]
    paths:
      - '.github/workflows/nov27-w5-qualification.yml'

permissions:
  contents: read

jobs:
  verify:
    name: Independent payment-state verifier (${{ matrix.lane }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        lane: [payer, seller]
    env:
      CLIENT: ${{ github.event.pull_request.base.sha }}
      HARNESS: db6f3da67737346c28edf2ed9d8bae44e86bce56
      HARNESS_TREE: 7ddc2ff45fdfc35a2fc04c884246757f5adde3ce
      BASE_REF: ${{ github.event.pull_request.base.ref }}
      LANE: ${{ matrix.lane }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.CLIENT }}
          path: client
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.HARNESS }}
          path: verifier
          persist-credentials: false
      - name: Check both identities and install the verifier outside production paths
        run: |
          set -euo pipefail
          test "$BASE_REF" = audit/nov27-six-finding-integration
          [[ "$CLIENT" =~ ^[0-9a-f]{40}$ ]]
          test "$(git -C client rev-parse HEAD)" = "$CLIENT"
          echo "CLIENT_TREE=$(git -C client rev-parse HEAD^{tree})" >> "$GITHUB_ENV"
          test "$(git -C verifier rev-parse HEAD)" = "$HARNESS"
          test "$(git -C verifier rev-parse HEAD^{tree})" = "$HARNESS_TREE"
          git -C verifier archive HEAD verification/independent-beta/harness | tar -x -C client
          test -z "$(git -C client status --porcelain -- apps packages scripts package.json package-lock.json tsconfig.base.json)"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Build clean client libraries and the signed loopback fixture
        working-directory: client
        run: |
          set -euo pipefail
          umask 077
          npm ci --ignore-scripts
          npm run build:libs
          ./node_modules/.bin/playwright install --with-deps chromium
          W5_PROPERTY_SCALE=10 node --test verification/independent-beta/harness/selftest.test.mjs
          node verification/independent-beta/harness/build.mjs --profile lean > "$RUNNER_TEMP/w5-build.log" 2>&1
      - name: Exercise the named scenarios and eight deterministic seeds
        working-directory: client
        run: |
          set -euo pipefail
          umask 077
          runner=run.mjs
          if [[ "$LANE" = seller ]]; then runner=seller-run.mjs; fi
          GHOSTPAY_CHROMIUM="$(node -p "require('playwright').chromium.executablePath()")"
          export GHOSTPAY_CHROMIUM
          set +e
          node "verification/independent-beta/harness/$runner" --candidate "$CLIENT" --named \
            --seeds 1-8 --concurrency 2 --out "$RUNNER_TEMP/w5-private" > "$RUNNER_TEMP/w5-run.log" 2>&1
          status=$?
          set -e
          echo "$status" > "$RUNNER_TEMP/w5-exit"
          exit "$status"
      - name: Verify scenario membership and retain sanitized evidence
        if: ${{ !cancelled() && hashFiles('client/apps/web/dist/.w5-build.json') != '' }}
        working-directory: client
        run: |
          umask 077
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import { readFileSync, writeFileSync } from 'node:fs';
          import { join } from 'node:path';
          import { distFingerprint } from './verification/independent-beta/harness/build.mjs';
          import { NAMED, CONTROLS, generated } from './verification/independent-beta/harness/scenarios.mjs';
          import { SELLER_NAMED, SELLER_CONTROLS, sellerGenerated } from './verification/independent-beta/harness/seller-scenarios.mjs';
          const { LANE, CLIENT, CLIENT_TREE, HARNESS, HARNESS_TREE, RUNNER_TEMP } = process.env;
          const payer = LANE === 'payer';
          const seeds = Array.from({ length: 8 }, (_, i) => i + 1);
          const control = (payer ? CONTROLS : SELLER_CONTROLS)[0];
          const expected = [control, ...(payer ? NAMED : SELLER_NAMED), ...seeds.map(n => (payer ? generated : sellerGenerated)(n))];
          const raw = readFileSync(join(RUNNER_TEMP, 'w5-private/run.json'));
          const record = JSON.parse(raw);
          const fingerprint = distFingerprint();
          // Emit only pinned names and bounded counters. Records, inputs and browser diagnostics stay private.
          const validSource = record.pinnedMain === CLIENT && record.source.head === CLIENT &&
            record.source.productionTreeClean && record.productionPathsDifferingFromPinnedMain.length === 0 &&
            record.build.head === CLIENT && record.build.profile === 'lean' && record.build.productionTreeClean &&
            record.build.dist.sha256 === fingerprint.sha256 && record.build.dist.files === fingerprint.files;
          assert(validSource, 'Source or bundle identity mismatch');
          const names = new Set(record.results.map(r => r.name));
          assert(names.size === expected.length && record.results.length === names.size &&
            expected.every(s => names.has(s.name)), 'Unexpected, missing or duplicate scenarios');
          assert.deepEqual(record.seeds, seeds, 'Invalid seed range');
          const outcomes = expected.map(s => {
            const r = record.results.find(row => row.name === s.name);
            const isControl = s.name === control.name;
            const expectedControlDetected = isControl && control.expectViolations.every(id => r.violations.some(v => v.inv === id));
            return { scenario: s.name, harnessError: r.harnessError !== null, unexpectedViolations: isControl ? 0 : r.violations.length,
              ambiguities: r.ambiguities.length, blockedOrigins: r.blockedOrigins.length, expectedControlDetected };
          });
          const exitCode = Number(readFileSync(join(RUNNER_TEMP, 'w5-exit'), 'utf8').trim());
          const passed = exitCode === 0 && outcomes.every(r => !r.harnessError && !r.unexpectedViolations && !r.blockedOrigins) &&
            outcomes.find(r => r.scenario === control.name).expectedControlDetected;
          const evidence = { lane: LANE, client: CLIENT, clientTree: CLIENT_TREE, harness: HARNESS, harnessTree: HARNESS_TREE,
            fixture: 'signed loopback lean build', bundle: fingerprint, rawReportSha256: createHash('sha256').update(raw).digest('hex'),
            passed, exitCode, outcomes };
          writeFileSync(join(RUNNER_TEMP, 'w5-summary.json'), JSON.stringify(evidence, null, 2) + '\n', { mode: 0o600 });
          console.log(JSON.stringify({ passed, scenarios: outcomes.length, lane: LANE }));
          if (!passed) process.exitCode = 1;
          JS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: w5-${{ matrix.lane }}-${{ env.CLIENT }}
          path: ${{ runner.temp }}/w5-summary.json
          if-no-files-found: error
          retention-days: 7
