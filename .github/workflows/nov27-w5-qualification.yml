name: November audit independent payment-state verification

on:
  pull_request:
    branches: [audit/nov27-six-finding-integration]
    paths:
      - '.github/workflows/nov27-w5-qualification.yml'

permissions:
  contents: read

jobs:
  verify:
    name: Independent payment-state verifier (${{ matrix.lane }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        lane: [payer, seller]
    env:
      CLIENT: ${{ github.event.pull_request.base.sha }}
      HARNESS: db6f3da67737346c28edf2ed9d8bae44e86bce56
      HARNESS_TREE: 7ddc2ff45fdfc35a2fc04c884246757f5adde3ce
      OBSERVER: ${{ github.event.pull_request.head.sha }}
      BASE_REF: ${{ github.event.pull_request.base.ref }}
      LANE: ${{ matrix.lane }}
      W5_PORT: '4173'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.CLIENT }}
          path: client
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.HARNESS }}
          path: verifier
          persist-credentials: false
      - name: Check both identities and install the verifier outside production paths
        run: |
          set -euo pipefail
          test "$BASE_REF" = audit/nov27-six-finding-integration
          [[ "$CLIENT" =~ ^[0-9a-f]{40}$ ]]
          test "$(git -C client rev-parse HEAD)" = "$CLIENT"
          echo "CLIENT_TREE=$(git -C client rev-parse HEAD^{tree})" >> "$GITHUB_ENV"
          test "$(git -C verifier rev-parse HEAD)" = "$HARNESS"
          test "$(git -C verifier rev-parse HEAD^{tree})" = "$HARNESS_TREE"
          git -C verifier archive HEAD verification/independent-beta/harness | tar -x -C client
          test -z "$(git -C client status --porcelain -- apps packages scripts package.json package-lock.json tsconfig.base.json)"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install the separately pinned seller-ledger observation supplement
        working-directory: client
        run: |
          set -euo pipefail
          [[ "$OBSERVER" =~ ^[0-9a-f]{40}$ ]]
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync, writeFileSync } from 'node:fs';
          const replaceOnce = (source, before, after, label) => {
            assert.equal(source.split(before).length - 1, 1, `observer source mismatch: ${label}`);
            return source.replace(before, after);
          };
          const sellerPath = 'verification/independent-beta/harness/seller.mjs';
          let seller = readFileSync(sellerPath, 'utf8');
          seller = replaceOnce(seller,
            `    return {\n      closed: false,\n      origin: location.origin,`,
            `    return {\n      closed: false,\n      origin: location.origin,\n      ledgerPresent: ledger !== null,\n      ledgerVisible: ledger !== null && ledger.getClientRects().length > 0 &&\n        getComputedStyle(ledger).display !== 'none' && getComputedStyle(ledger).visibility !== 'hidden',`,
            'seller ledger presence');
          writeFileSync(sellerPath, seller);

          const runnerPath = 'verification/independent-beta/harness/seller-run.mjs';
          let runner = readFileSync(runnerPath, 'utf8');
          runner = replaceOnce(runner,
            `      rec.obs = Object.fromEntries(Object.entries(obs).map(([k, o]) => [k, o.closed ? 'closed' : { matches: o.matches, cards: o.cards.map((c) => c.text.slice(0, 400)), alerts: o.alerts, scanStatus: o.scanStatus, ledgerLocked: o.ledgerLocked }]));`,
            `      rec.obs = Object.fromEntries(Object.entries(obs).map(([k, o]) => [k, o.closed ? 'closed' : { matches: o.matches, cards: o.cards.map((c) => c.text.slice(0, 400)), alerts: o.alerts, scanStatus: o.scanStatus, ledgerPresent: o.ledgerPresent, ledgerVisible: o.ledgerVisible, ledgerLocked: o.ledgerLocked }]));`,
            'trace ledger presence');
          runner = replaceOnce(runner,
            `async function sellerReady(world, label) {\n  const page = world.tabs[label];\n  await unlockSellerKeys(page, world.origin);\n  await openScan(page);\n  return unlockLedger(page);\n}`,
            `async function sellerReady(world, label) {\n  const page = world.tabs[label];\n  const keys = await unlockSellerKeys(page, world.origin);\n  await openScan(page);\n  const ledger = await unlockLedger(page);\n  const observed = await observeSeller(page);\n  return { keys, ledger, readback: { ledgerPresent: observed.ledgerPresent, ledgerVisible: observed.ledgerVisible,\n    ledgerLocked: observed.ledgerLocked, identities: observed.cards.map(({ digest, units }) => ({ digest, units })) } };\n}`,
            'ready readback');
          runner = replaceOnce(runner,
            `      for (const label of ['S1', 'S2']) {\n        await world.tabs[label].reload();\n        await world.tabs[label].waitForTimeout(800);\n        await sellerReady(world, label);\n      }\n      return { compared: true };`,
            `      const tabs = {};\n      for (const label of ['S1', 'S2']) {\n        await world.tabs[label].reload();\n        await world.tabs[label].waitForTimeout(800);\n        tabs[label] = await sellerReady(world, label);\n      }\n      return { compared: true, tabs };`,
            'comparison readbacks');
          writeFileSync(runnerPath, runner);
          JS
      - name: Build clean client libraries and the signed loopback fixture
        working-directory: client
        run: |
          set -euo pipefail
          umask 077
          npm ci --ignore-scripts
          npm run build:libs
          ./node_modules/.bin/playwright install --with-deps chromium
          W5_PROPERTY_SCALE=10 node --test verification/independent-beta/harness/selftest.test.mjs
          node --input-type=module > "$RUNNER_TEMP/w5-build.log" 2>&1 <<'JS'
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          import { cpSync, existsSync, readFileSync, rmSync, writeFileSync } from 'node:fs';
          import { join } from 'node:path';
          import { prepareManifestFixture } from './apps/web/e2e/prepare-manifest.mjs';
          import { DIST, distFingerprint, sourceIdentity } from './verification/independent-beta/harness/build.mjs';
          const source = sourceIdentity();
          assert(source.head === process.env.CLIENT && source.productionTreeClean);
          assert(!existsSync(DIST), 'Unexpected prebuilt web artifacts');
          const origin = 'http://localhost:' + process.env.W5_PORT;
          const build = join(process.env.RUNNER_TEMP, 'w5-pages');
          const fixture = prepareManifestFixture();
          try {
            const env = { ...process.env, GITHUB_SHA: source.head, GP_COMMIT: source.head, GHOSTPAY_PAGES_DEV: '1',
              GHOSTPAY_PAGES_ORIGIN: origin, GHOSTPAY_PAGES_DEPLOYMENTS_DIR: fixture.directory, GHOSTPAY_RELEASE_PUBKEYS: fixture.publicKey };
            execFileSync('bash', ['scripts/pages/build-pages.sh', build], { env, stdio: 'inherit' });
            const site = join(build, 'site');
            execFileSync(process.execPath, ['scripts/pages/verify-pages-artifact.mjs', site, join(build, 'evidence/SHA256SUMS'),
              '--expect-commit', source.head], { stdio: 'inherit' });
            assert.equal(JSON.parse(readFileSync(join(site, 'build-info.json'))).pagesOrigin, origin);
            cpSync(site, DIST, { recursive: true });
            writeFileSync(join(DIST, '.w5-build.json'), JSON.stringify({ profile: 'lean', ...source, dist: distFingerprint(),
              approvedFixtureOrigin: origin, builtAt: new Date().toISOString() }));
          } finally {
            rmSync(fixture.directory, { recursive: true, force: true });
          }
          JS
      - name: Exercise the named scenarios and eight deterministic seeds
        working-directory: client
        run: |
          set -euo pipefail
          umask 077
          runner=run.mjs
          if [[ "$LANE" = seller ]]; then runner=seller-run.mjs; fi
          GHOSTPAY_CHROMIUM="$(node -p "require('playwright').chromium.executablePath()")"
          export GHOSTPAY_CHROMIUM
          set +e
          node "verification/independent-beta/harness/$runner" --candidate "$CLIENT" --named \
            --seeds 1-8 --concurrency 2 --out "$RUNNER_TEMP/w5-private" > "$RUNNER_TEMP/w5-run.log" 2>&1
          status=$?
          set -e
          echo "$status" > "$RUNNER_TEMP/w5-exit"
          exit "$status"
      - name: Verify scenario membership and retain sanitized evidence
        if: ${{ !cancelled() && hashFiles('client/apps/web/dist/.w5-build.json') != '' }}
        working-directory: client
        run: |
          umask 077
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import { readFileSync, writeFileSync } from 'node:fs';
          import { join } from 'node:path';
          import { distFingerprint } from './verification/independent-beta/harness/build.mjs';
          import { NAMED, CONTROLS, generated } from './verification/independent-beta/harness/scenarios.mjs';
          import { SELLER_NAMED, SELLER_CONTROLS, sellerGenerated } from './verification/independent-beta/harness/seller-scenarios.mjs';
          const { LANE, CLIENT, CLIENT_TREE, HARNESS, HARNESS_TREE, OBSERVER, RUNNER_TEMP } = process.env;
          const payer = LANE === 'payer';
          const seeds = Array.from({ length: 8 }, (_, i) => i + 1);
          const control = (payer ? CONTROLS : SELLER_CONTROLS)[0];
          const expected = [control, ...(payer ? NAMED : SELLER_NAMED), ...seeds.map(n => (payer ? generated : sellerGenerated)(n))];
          const raw = readFileSync(join(RUNNER_TEMP, 'w5-private/run.json'));
          const record = JSON.parse(raw);
          const fingerprint = distFingerprint();
          // Emit only pinned names and bounded counters. Records, inputs and browser diagnostics stay private.
          const validSource = record.pinnedMain === CLIENT && record.source.head === CLIENT &&
            record.source.productionTreeClean && record.productionPathsDifferingFromPinnedMain.length === 0 &&
            record.build.head === CLIENT && record.build.profile === 'lean' && record.build.productionTreeClean &&
            record.build.approvedFixtureOrigin === 'http://localhost:' + process.env.W5_PORT &&
            record.build.dist.sha256 === fingerprint.sha256 && record.build.dist.files === fingerprint.files;
          assert(validSource, 'Source or bundle identity mismatch');
          const names = new Set(record.results.map(r => r.name));
          assert(names.size === expected.length && record.results.length === names.size &&
            expected.every(s => names.has(s.name)), 'Unexpected, missing or duplicate scenarios');
          assert.deepEqual(record.seeds, seeds, 'Invalid seed range');
          const outcomes = expected.map(s => {
            const r = record.results.find(row => row.name === s.name);
            const isControl = s.name === control.name;
            const expectedControlDetected = isControl && control.expectViolations.every(id => r.violations.some(v => v.inv === id));
            const incompleteTabComparisons = [];
            for (const [i, step] of s.steps.entries()) {
              if (step.op !== 'compareTabs') continue;
              const observed = r.trace?.find(row => row.i === i);
              const expectedUnits = ['498750000000000000', '299250000000000000'];
              const ready = tab => {
                const view = observed?.obs?.[tab];
                const result = observed?.result?.tabs?.[tab];
                const identities = result?.readback?.identities;
                const visibleIdentities = new Map((view?.cards ?? []).map(text => {
                  const digest = (text.match(/Invoice (0x[0-9a-f]{64})/i) ?? [])[1]?.toLowerCase();
                  const units = (text.match(/(\d{6,}) base units of native/) ?? [])[1];
                  return [units, digest];
                }));
                return Array.isArray(view?.cards) && view.ledgerPresent === true && view.ledgerVisible === true &&
                  view.ledgerLocked === false && ['unlocked', 'already-unlocked'].includes(result?.ledger) &&
                  result?.readback?.ledgerPresent === true && result.readback.ledgerVisible === true &&
                  result.readback.ledgerLocked === false && Array.isArray(identities) && identities.length === 2 &&
                  expectedUnits.every(units => identities.some(id => id?.units === units && /^0x[0-9a-f]{64}$/.test(id?.digest ?? '') &&
                    visibleIdentities.get(units) === id.digest));
              };
              const identities = tab => new Map((observed?.result?.tabs?.[tab]?.readback?.identities ?? []).map(id => [id.units, id.digest]));
              const sameIdentities = () => expectedUnits.every(units => identities('S1').get(units) === identities('S2').get(units));
              if (observed?.step?.op !== 'compareTabs' || observed.error !== undefined ||
                  observed.result?.compared !== true || !ready('S1') || !ready('S2') || !sameIdentities()) incompleteTabComparisons.push(i);
            }
            const declared = new Set(isControl ? control.expectViolations : []);
            const invariantCounts = {};
            const additionalControlInvariants = {};
            for (const { inv } of r.violations) {
              const id = /^(I[1-8]|SI(?:[1-9]|1[0-2]))$/.test(inv) ? inv : 'unrecognized';
              invariantCounts[id] = (invariantCounts[id] ?? 0) + 1;
              if (isControl && !declared.has(inv)) additionalControlInvariants[id] = (additionalControlInvariants[id] ?? 0) + 1;
            }
            return { scenario: s.name, injectedPositiveControl: isControl, harnessError: r.harnessError !== null,
              violations: r.violations.length, invariantCounts, incompleteTabComparisons, requiredControlInvariants: [...declared],
              additionalControlInvariants, ordinaryViolations: isControl ? 0 : r.violations.length,
              ambiguities: r.ambiguities.length, blockedOrigins: r.blockedOrigins.length, expectedControlDetected };
          });
          const exitCode = Number(readFileSync(join(RUNNER_TEMP, 'w5-exit'), 'utf8').trim());
          const passed = exitCode === 0 && outcomes.every(r => !r.harnessError && !r.ordinaryViolations && !r.blockedOrigins && r.incompleteTabComparisons.length === 0) &&
            outcomes.find(r => r.scenario === control.name).expectedControlDetected;
          const evidence = { lane: LANE, client: CLIENT, clientTree: CLIENT_TREE, harness: HARNESS, harnessTree: HARNESS_TREE, observer: OBSERVER,
            fixture: 'signed loopback lean Pages build', approvedOrigin: record.build.approvedFixtureOrigin, bundle: fingerprint, rawReportSha256: createHash('sha256').update(raw).digest('hex'),
            passed, exitCode, outcomes };
          writeFileSync(join(RUNNER_TEMP, 'w5-summary.json'), JSON.stringify(evidence, null, 2) + '\n', { mode: 0o600 });
          console.log(JSON.stringify({ passed, scenarios: outcomes.length, lane: LANE }));
          if (!passed) process.exitCode = 1;
          JS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: w5-${{ matrix.lane }}-${{ env.CLIENT }}
          path: ${{ runner.temp }}/w5-summary.json
          if-no-files-found: error
          retention-days: 7
