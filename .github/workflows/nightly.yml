name: Nightly
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

# Deep scheduled checks. Native analyzers are also reused by contract-related pull requests and, as a required gate on
# the tagged commit, by release.yml; no secrets, read-only token. The release does not run the other nightly jobs.
#
# Open gaps, deliberately NOT faked here (docs/operators/release-and-verify.md "Open gaps"):
#   - Mutation testing (gambit) and mainnet-fork tests: no CI configuration exists yet.
# Echidna/Mythril run through the shared contract-analysis workflow; local native evidence does not
# substitute for a complete hosted campaign on the exact checked-out source.
# Python is pinned to 3.12 with actions/setup-python for every pip-installed tool: the runner's system Python moved to
# 3.14, where mythril's coincurve/cffi build fails ("Expected exactly one LICENSE file in cffi distribution").

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    defaults:
      run:
        working-directory: packages/contracts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        with:
          version: v1.8.5
      - name: Forge fuzz at 100k runs
        run: forge test --fuzz-runs 100000

  slither:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        working-directory: packages/contracts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        with:
          version: v1.8.5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Install Slither and the pinned compiler
        run: |
          python3 -m pip install --quiet "slither-analyzer==0.11.6" "solc-select==1.2.0"
          solc-select install 0.8.28 && solc-select use 0.8.28
      - name: Slither gate (fails on Medium or High; same command as ci.yml)
        run: slither . --filter-paths "lib|test|script" --fail-medium --exclude-informational --exclude-low
      # SEC-17: visibility for all severities is separate from the unchanged required gate above.
      # This report also lists inline-suppressed findings; publishing a report does not approve its findings.
      - name: Slither report with every detector, Low and Informational included
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/slither"
          slither . --filter-paths "lib|test|script" --fail-none --show-ignored-findings \
            --json "$RUNNER_TEMP/slither/slither-all-detectors.json" --checklist > "$RUNNER_TEMP/slither/slither-all-detectors.md"
          jq -r '.results.detectors // [] | group_by(.impact) | map("\(.[0].impact): \(length)") | join(", ")' \
            "$RUNNER_TEMP/slither/slither-all-detectors.json" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: slither-all-detectors-${{ github.sha }}
          path: ${{ runner.temp }}/slither/
          if-no-files-found: error
          retention-days: 30

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Production dependencies (gating)
        run: npm audit --omit=dev --audit-level=high
      - name: All dependencies incl. dev (reported, non-gating)
        continue-on-error: true
        run: npm audit --audit-level=high
      - name: Signature and provenance check of installed packages
        run: npm audit signatures

  reproducibility:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
      - name: Two clean builds in separate directories must be byte-identical
        run: bash scripts/repro-check.sh --head

  contract-analysis:
    uses: ./.github/workflows/contract-analysis.yml
    permissions:
      contents: read
