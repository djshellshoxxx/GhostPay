name: Home journeys on mobile operating systems

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/home-mobile-simulators.yml'
      - 'apps/web/e2e/native-mobile/**'
      - 'apps/web/src/components/HomeWalkthroughs.tsx'

permissions:
  contents: read

concurrency:
  group: home-mobile-simulators-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android API ${{ matrix.api }} · ${{ matrix.browser }} · ${{ matrix.profile }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox]
        api: [30, 35]
        include:
          - api: 30
            profile: pixel_2
            firefox: '140.0'
            sha: d3ea731e1ee4c48b36241e4f9745fb76019ec30a5d5e8d99c20256a25d13070d
          - api: 35
            profile: pixel_tablet
            firefox: '150.0'
            sha: 58c9d9dbde2c2b2f3ad1f227c0042ac4adf239d7dd0761f36da5874335e020bf
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node-libs
      - run: npm run build -w @ghostpay/web
        env:
          GHOSTPAY_LOCAL_BUILD_PROFILE: lean
      - name: Enable runner access to KVM
        run: sudo chmod 666 /dev/kvm
      - uses: reactivecircus/android-emulator-runner@324029e2f414c084d8b15ba075288885e74aef9c # v2.34.0
        with:
          api-level: ${{ matrix.api }}
          target: google_apis_playstore
          arch: x86_64
          profile: ${{ matrix.profile }}
          disable-animations: true
          script: bash apps/web/e2e/native-mobile/android.sh
        env:
          BROWSER: ${{ matrix.browser }}
          FIREFOX_VERSION: ${{ matrix.firefox }}
          FIREFOX_SHA256: ${{ matrix.sha }}
  apple:
    name: ${{ matrix.browser }} · ${{ matrix.device }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, device: iPhone, runtime: oldest, browser: safari }
          - { os: macos-26, device: iPad, runtime: newest, browser: safari }
          - { os: macos-26, device: iPhone, runtime: newest, browser: fennec }
          - { os: macos-26, device: iPad, runtime: newest, browser: fennec }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node-libs
      - run: npm run build -w @ghostpay/web
        env:
          GHOSTPAY_LOCAL_BUILD_PROFILE: lean
      - if: matrix.browser == 'fennec'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mozilla-mobile/firefox-ios
          ref: a931ff36e4b0152c6a0e9d98a5106fa849a5c1d3
          path: _firefox-simulator
          persist-credentials: false
      - run: bash apps/web/e2e/native-mobile/ios.sh
        env:
          DEVICE: ${{ matrix.device }}
          RUNTIME: ${{ matrix.runtime }}
          BROWSER: ${{ matrix.browser }}
