name: Native browser qualification

on:
  pull_request:
    paths:
      - '.github/workflows/native-browser-qualification.yml'
      - '.github/actions/**'
      - 'apps/web/**'
      - 'packages/**'
      - 'scripts/build-workspaces.mjs'
      - 'scripts/tests/native-crypto-probe.test.mjs'
      - 'scripts/tests/native-http-redirect-fixture.test.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.base.json'
      - '!**/*.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/native-browser-qualification.yml'
      - '.github/actions/**'
      - 'apps/web/**'
      - 'packages/**'
      - 'scripts/build-workspaces.mjs'
      - 'scripts/tests/native-crypto-probe.test.mjs'
      - 'scripts/tests/native-http-redirect-fixture.test.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.base.json'
      - '!**/*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: native ${{ matrix.engine }} (${{ matrix.profile }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        engine: [firefox, webkit]
        profile: [full, lean]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node-libs
      - id: pw
        run: echo "version=$(node -p "require('./apps/web/package.json').devDependencies['@playwright/test']")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-native-${{ runner.os }}-${{ steps.pw.outputs.version }}-${{ matrix.engine }}
      # Browser installation is permitted on the GitHub-hosted runner, not the restricted local workspace.
      - run: ./node_modules/.bin/playwright install --with-deps ${{ matrix.engine }}
      - name: Verify native harness fixture contracts
        run: node --test scripts/tests/native-crypto-probe.test.mjs scripts/tests/native-http-redirect-fixture.test.mjs
      - name: Run existing journeys with the selected native engine
        shell: bash
        env:
          GHOSTPAY_LOCAL_BUILD_PROFILE: ${{ matrix.profile }}
          NATIVE_ENGINE: ${{ matrix.engine }}
          # Preserve native process stderr for unexplained page crashes; this does not change browser settings.
          DEBUG: pw:browser
        run: |
          set -euo pipefail
          case "$NATIVE_ENGINE" in
            firefox) projects=(--project=firefox) ;;
            webkit) projects=(--project=webkit --project=webkit-iphone-se --project=webkit-ipad-mini) ;;
            *) exit 1 ;;
          esac
          mkdir -p apps/web/test-results
          git rev-parse HEAD HEAD^{tree} > apps/web/test-results/native-browser-process.log
          npm exec --workspace @ghostpay/web -- playwright test --config=playwright.native.config.ts --trace=retain-on-failure "${projects[@]}" 2>&1 | tee -a apps/web/test-results/native-browser-process.log
      - name: Record successful source identity
        env:
          NATIVE_ENGINE: ${{ matrix.engine }}
          BUILD_PROFILE: ${{ matrix.profile }}
          PR_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --quiet HEAD --
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { mkdirSync, readFileSync, writeFileSync } from 'node:fs';
          const git = (ref) => execFileSync('git', ['rev-parse', ref], { encoding: 'utf8' }).trim();
          const report = JSON.parse(readFileSync('apps/web/test-results/native-results.json', 'utf8'));
          const { expected, unexpected, flaky, skipped } = report.stats;
          if (![expected, unexpected, flaky, skipped].every((n) => Number.isSafeInteger(n) && n >= 0)
            || expected === 0 || unexpected !== 0) throw new Error('Native browser results are missing or not successful.');
          const evidence = { source: git('HEAD'), tree: git('HEAD^{tree}'), prHead: process.env.PR_HEAD,
            engine: process.env.NATIVE_ENGINE, profile: process.env.BUILD_PROFILE, commandExitCode: 0,
            counts: { passed: expected, failed: unexpected, flaky, skipped },
            scope: 'playwright.native.config.ts; native engines and viewport emulation, not physical devices or Tor routing' };
          mkdirSync('apps/web/test-results', { recursive: true });
          writeFileSync('apps/web/test-results/native-source.json', JSON.stringify(evidence, null, 2) + '\n');
          NODE
      - name: Preserve actual browser results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-${{ matrix.engine }}-${{ matrix.profile }}-${{ github.run_id }}
          path: apps/web/test-results/
          if-no-files-found: warn
          retention-days: 7
