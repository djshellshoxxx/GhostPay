name: Setup Foundry for packages/contracts
description: Pinned Foundry, the pinned solc (cached), and the forge build cache for the contracts package.
inputs:
  cache-name:
    description: Distinguishes forge caches whose compiler settings differ (test vs coverage).
    required: true
runs:
  using: composite
  steps:
    - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
      with:
        version: v1.8.5
    - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: ~/.svm
        key: svm-${{ runner.os }}-0.8.28
    # A restored cache is not integrity-checked by actions/cache, and svm prefers ~/.svm when it exists. Fail closed
    # if a cached solc differs from the official binaries.soliditylang.org build (audit F-3, 2026-11-18).
    - shell: bash
      run: |
        set -euo pipefail
        expected=9a0fb7e0db2c0641dbae1c5cc645dc686820c83af516226abb1c0a2f76636f25
        for f in "$HOME/.svm/0.8.28/solc-0.8.28" "${XDG_DATA_HOME:-$HOME/.local/share}/svm/0.8.28/solc-0.8.28"; do
          [[ -e "$f" ]] || continue
          echo "$expected  $f" | sha256sum -c --quiet - || { echo "::error::cached solc 0.8.28 hash mismatch: $f"; exit 1; }
        done
    # forge re-checks content hashes recorded in its cache file, so a partial restore (restore-keys) only
    # skips recompilation of unchanged sources; it cannot serve a stale artifact.
    - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: |
          packages/contracts/out
          packages/contracts/cache
        key: forge-${{ inputs.cache-name }}-${{ runner.os }}-${{ hashFiles('packages/contracts/src/**', 'packages/contracts/test/**', 'packages/contracts/script/**', 'packages/contracts/lib/**', 'packages/contracts/foundry.toml', 'packages/contracts/remappings.txt') }}
        restore-keys: |
          forge-${{ inputs.cache-name }}-${{ runner.os }}-
