name: Setup Node and built libs
description: Node 22 with the npm cache, `npm ci`, and the workspace libs built (or restored from a cache keyed on every input of the build).
inputs:
  save-cache:
    description: >-
      'true' (default) saves the built-libs cache and the npm cache after the job, as before. Any other value makes
      the libs cache restore-only and turns the npm cache off, so nothing the job leaves behind is stored for later
      runs. Pass 'false' in jobs that run an AI agent or other untrusted code.
    required: false
    default: 'true'
runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: "22"
        cache: ${{ inputs.save-cache == 'true' && 'npm' || '' }}
        package-manager-cache: ${{ inputs.save-cache == 'true' }}
    - run: npm ci --ignore-scripts
      shell: bash
    # Workspace packages resolve each other through their built `dist`. Cache EVERY package's dist and key on every
    # package's inputs: a hand-kept subset skipped build:libs on a hit and left e.g. address-safety, tx-review and
    # btc-silent-payments unbuilt, so apps/web failed to typecheck (e2e webServer) depending on cache state.
    - id: libs
      if: inputs.save-cache == 'true'
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: packages/*/dist
        key: libs-${{ runner.os }}-node22-${{ hashFiles('package.json', 'package-lock.json', 'tsconfig.base.json', 'scripts/build-workspaces.mjs', 'packages/*/src/**', 'packages/*/scripts/**', 'packages/*/package.json', 'packages/*/tsconfig*.json') }}
    # Restore-only twin of the step above (same commit, path and key): a job that runs untrusted code must not save
    # its packages/*/dist under the key of main's sources.
    - id: libs-restore
      if: inputs.save-cache != 'true'
      uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: packages/*/dist
        key: libs-${{ runner.os }}-node22-${{ hashFiles('package.json', 'package-lock.json', 'tsconfig.base.json', 'scripts/build-workspaces.mjs', 'packages/*/src/**', 'packages/*/scripts/**', 'packages/*/package.json', 'packages/*/tsconfig*.json') }}
    - if: steps.libs.outputs.cache-hit != 'true' && steps.libs-restore.outputs.cache-hit != 'true'
      run: npm run build:libs
      shell: bash
