# Config only: update PRs are proposed weekly, grouped, and still need review and a green CI.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # The fhEVM plugin validates its paired Solidity config; upgrade this stack together.
    ignore:
      - dependency-name: "@fhevm/solidity"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]
      npm-major:
        update-types: ["major"]
    commit-message:
      prefix: "deps"
