# Config only: update PRs are proposed weekly, grouped, and still need review and a green CI.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # The fhEVM plugin validates exact paired Solidity/SDK versions; upgrade this stack together.
    ignore:
      - dependency-name: "@fhevm/solidity"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "@zama-fhe/relayer-sdk"
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]
      npm-major:
        update-types: ["major"]
    commit-message:
      prefix: "deps"
  # SEC-26: base images. One entry per ecosystem lists every directory that holds a Dockerfile (Dockerfile,
  # Dockerfile.*) or a compose file, so a tag or digest pin there gets update PRs like the npm and Actions pins.
  # Images that are only ARG/`${VAR:-default}` defaults may not be parsed by Dependabot: re-resolve those by hand
  # (deploy/README.md "Pin images"). Locally built images (ghostpay-*:local, ghostpay-it/*) are not registry images.
  - package-ecosystem: docker
    directories:
      - /apps/relayer
      - /deploy/tor
      - /infra/devnet
      - /infra/integration
      - /infra/web
      - /scripts/regtest
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      docker:
        patterns: ["*"]
    commit-message:
      prefix: "deps"
  - package-ecosystem: docker-compose
    directories:
      - /deploy
      - /infra/devnet
      - /infra/integration
      - /scripts/regtest
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      docker-compose:
        patterns: ["*"]
    commit-message:
      prefix: "deps"
