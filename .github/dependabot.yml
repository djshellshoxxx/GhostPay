# Config only: update PRs are proposed weekly, grouped, and still need review and a green CI.
version: 2
updates:
  - package-ecosystem: github-actions
    # "/" alone scans only .github/workflows and a root action.yml; the composite actions under .github/actions/*
    # pin actions too (actions/cache v5.0.5, setup-node v7.1.0, foundry-toolchain v1.9.2) and were left behind when the
    # workflows moved to actions/cache v6.1.0.
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # The fhEVM plugin validates exact paired Solidity/SDK versions; upgrade this stack together.
    ignore:
      - dependency-name: "@fhevm/solidity"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "@zama-fhe/relayer-sdk"
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]
      npm-major:
        update-types: ["major"]
    commit-message:
      prefix: "deps"
